# Extra
[extra]
author = "Speyll"
favicon = "favicon.ico"
list_pages = false
twitter_card = true
display_author = true

## Navigation
# `path` is an internal Zola path (language-aware, with default-language fallback);
# `url` is used verbatim for external links.
# `key` is optional and looks up the label in [translations]; `name` is the fallback label.
header_nav = [
  { path = "@/_index.md", key = "nav_home", name = "Home" },
  { path = "@/about.md", key = "nav_about", name = "About" },
  { path = "@/journal.md", key = "nav_journal", name = "Journal" },
  { path = "@/blog/_index.md", key = "nav_blog", name = "Blog" }
]

